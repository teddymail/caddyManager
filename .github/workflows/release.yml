name: Release

# 触发：推送 v* 标签（如 v1.0.0），或手动在 Actions 页面触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 重复触发时取消上一次，避免重复编译
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（仅测试，不编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行单元/API 测试
        run: npm test

  build-linux:
    name: 构建 Linux (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: 编译单文件二进制
        run: node scripts/build.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/caddymanager-*

  build-macos:
    name: 构建 macOS (${{ matrix.target }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bun-darwin-arm64, bun-darwin-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: 编译单文件二进制
        run: node scripts/build.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/caddymanager-*

  release:
    name: 发布 Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256 校验和
        run: cd dist && sha256sum caddymanager-* > SHA256SUMS.txt
      - name: 创建 GitHub Release 并上传二进制
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
